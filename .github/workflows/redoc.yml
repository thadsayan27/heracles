name: ReDoc 

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-redoc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Generate OpenAPI
        run: ./gradlew clean generateOpenApiDocs

      - name: Generate ReDoc HTML
        run: |
          mkdir -p public
          npx @redocly/cli build-docs build/openapi/openapi.json --output public/index.html

      - name: Upload to Github Pages 
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build-redoc
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
