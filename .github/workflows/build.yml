name: Build Docker image

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"

permissions:
  contents: read

jobs:
  test:
    name: JUnit Tests
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: test
      JWT_SECRET_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      JWT_REFRESH_SECRET_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Run tests
        run: ./gradlew test

  build:
    runs-on: ubuntu-latest
    needs : test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: heracles:latest
