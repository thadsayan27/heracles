spring:
  application:
    name: heracles

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

heracles:
  jwt:
    secret: ${JWT_SECRET_KEY:defaultSecretKey} #base64
    refresh-secret: ${JWT_REFRESH_SECRET_KEY:defaultRefreshSecretKey} #base64
    expiration-ms: 1800000 # 0.5h
    refresh-expiration-ms: 172800000 # 48h